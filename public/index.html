<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet AI - Tecnologia Veterinária Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; }
        .premium-gradient { background: linear-gradient(135deg, #10b981 0%, #34d399 50%, #059669 100%); }
        .text-gradient { background: linear-gradient(to right, #10b981, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-2xl w-full text-center space-y-8 animate-in fade-in zoom-in duration-1000">
        <!-- Logo -->
        <div class="flex justify-center mb-6">
            <div class="premium-gradient p-4 rounded-3xl shadow-[0_0_50px_rgba(16,185,129,0.3)]">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.7 1h5.9a2 2 0 0 1 2 2v1"/><path d="M18 22a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M15 18h6"/><path d="M18 15v6"/></svg>
            </div>
        </div>

        <h1 class="text-5xl md:text-7xl font-black tracking-tighter leading-none">
            VET <span class="text-gradient">AI</span>
        </h1>
        
        <p class="text-gray-400 text-lg md:text-xl font-medium max-w-lg mx-auto leading-relaxed">
            Plataforma de inteligência artificial especializada em saúde e nutrição para pets de elite.
        </p>

        <div class="glass p-8 rounded-[2.5rem] space-y-6">
            <div class="space-y-2">
                <div class="inline-block px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] font-bold tracking-widest uppercase mb-2">
                    SISTEMA ONLINE
                </div>
                <h2 class="text-2xl font-bold">Acesse sua Área Exclusiva</h2>
                <p class="text-sm text-gray-500">Clique abaixo para entrar no painel de monitoramento inteligente do seu pet.</p>
            </div>

            <!-- Botão Corrigido: Agora ele aponta para a rota do Next.js -->
            <a href="/login" class="block w-full premium-gradient text-black font-black py-5 rounded-2xl text-lg shadow-xl shadow-emerald-500/20 transition-all hover:scale-[1.02] active:scale-95 uppercase tracking-tighter">
                Acessar Painel de Controle
            </a>
        </div>

        <footer class="pt-8 opacity-30 text-[10px] uppercase tracking-[0.4em] font-bold">
            WS Studios Elite Technology
        </footer>
    </div>
</body>
</html>
