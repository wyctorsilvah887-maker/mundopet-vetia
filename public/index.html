<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet AI - WS Studios</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 20px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            max-width: 400px;
        }
        .logo {
            background: linear-gradient(135deg, #10b981, #059669);
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }
        h1 {
            font-size: 24px;
            margin: 0 0 10px;
            letter-spacing: -1px;
        }
        span { color: #10b981; }
        p {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #10b981;
            color: #000;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            transition: transform 0.2s;
            display: inline-block;
        }
        .btn:hover {
            transform: scale(1.05);
            background-color: #34d399;
        }
        .footer {
            position: absolute;
            bottom: 30px;
            font-size: 10px;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v5.5"></path><path d="M12 10v4"></path><path d="M10 12h4"></path></svg>
        </div>
        <h1>Vet<span>AI</span> Elite</h1>
        <p>Bem-vindo ao portal de inteligência veterinária da WS Studios. Sua plataforma está sendo sincronizada com o domínio principal.</p>
        <a href="/" class="btn">ACESSAR PAINEL IA</a>
    </div>
    <div class="footer">Vet AI Technology • Independência Total</div>
</body>
</html>
