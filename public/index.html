<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet AI - Carregando...</title>
    <style>
        body {
            background-color: #000;
            color: #10b981;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .loader {
            border: 4px solid #1a1a1a;
            border-top: 4px solid #10b981;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 { font-size: 1.5rem; letter-spacing: -0.05em; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h1>Sincronizando Vet AI...</h1>
    <p style="color: #666; font-size: 0.8rem;">Se o site não carregar em instantes, verifique o Console do Firebase.</p>
</body>
</html>
